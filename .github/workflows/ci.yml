name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Style (PEP8)
        run: python -m pycodestyle --max-line-length=100 api dashboard scripts tests preprocessing.py
      - name: Tests
        run: python -m pytest -q tests
