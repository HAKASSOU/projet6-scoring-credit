# Déploiement de l'API sur Render (plan gratuit) : "New > Blueprint" puis choisir le dépôt.
services:
  - type: web
    name: scoring-credit-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
